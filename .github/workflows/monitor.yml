name: Monitor de Editais IMD (Telegram)

on:
  schedule:
    # Executa a cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite execução manual pelo GitHub

jobs:
  check-editais:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Necessário para conseguir salvar o JSON de volta no repositório

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_editais.py

      - name: Salvar histórico de editais vistos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add editais_vistos.json
          git diff --quiet && git diff --cached --quiet || git commit -m "chore: atualiza editais vistos [skip ci]"
          git push